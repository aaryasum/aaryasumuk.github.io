<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460">
  <!-- Personal icon pattern for the page margins.
       Robotics: robot, robot arm, gripper, signal pulse, gear (MechE)
       Music: guitar, music notes, microphone (a cappella)
       Life: waves (swimming), graduation cap (Stanford)
       Most icons in warm brown; a few tinted the site accent blue. -->
  <g fill="none" stroke="#a4936f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">

    <!-- robot -->
    <g transform="translate(38 48) rotate(-8) scale(1.15)">
      <rect x="4" y="8" width="16" height="12" rx="2"/>
      <path d="M12 8V4"/>
      <circle cx="12" cy="3" r="1"/>
      <path d="M9 13v2"/><path d="M15 13v2"/>
      <path d="M2 14h2"/><path d="M20 14h2"/>
    </g>

    <!-- music note -->
    <g transform="translate(180 26) rotate(12)">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </g>

    <!-- gear (blue) -->
    <g transform="translate(310 62) rotate(-6) scale(1.1)" stroke="#3a5a78" opacity="0.62">
      <circle cx="12" cy="12" r="3.5"/>
      <path d="M12 3v2.5"/><path d="M12 18.5V21"/>
      <path d="M3 12h2.5"/><path d="M18.5 12H21"/>
      <path d="m5.6 5.6 1.8 1.8"/><path d="m16.6 16.6 1.8 1.8"/>
      <path d="m5.6 18.4 1.8-1.8"/><path d="m16.6 7.4 1.8-1.8"/>
    </g>

    <!-- waves -->
    <g transform="translate(398 148) rotate(6) scale(1.1)">
      <path d="M2 9c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/>
      <path d="M2 15c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/>
    </g>

    <!-- guitar -->
    <g transform="translate(72 168) rotate(14) scale(1.2)">
      <path d="M13.5 10.5 20 4"/>
      <path d="M20 4l1.5 1.5"/><path d="M19 5.5 17.5 4"/>
      <circle cx="8" cy="16" r="5"/>
      <circle cx="12.5" cy="11.5" r="3"/>
      <circle cx="8.5" cy="15.5" r="1.3"/>
    </g>

    <!-- signal pulse (blue) -->
    <g transform="translate(220 186) rotate(-10)" stroke="#3a5a78" opacity="0.6">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </g>

    <!-- graduation cap -->
    <g transform="translate(352 252) rotate(5) scale(1.1)">
      <path d="M22 10 12 5 2 10l10 5 10-5Z"/>
      <path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>
    </g>

    <!-- microphone -->
    <g transform="translate(120 296) rotate(-9) scale(1.05)">
      <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/>
      <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
      <path d="M12 18v4"/>
    </g>

    <!-- robot arm (blue) -->
    <g transform="translate(28 380) rotate(8) scale(1.2)" stroke="#3a5a78" opacity="0.58">
      <path d="M5 21h9"/>
      <path d="M9.5 21v-3.5"/>
      <circle cx="9.5" cy="16.3" r="1.2"/>
      <path d="M10.2 15.3 13.3 11"/>
      <circle cx="14" cy="10" r="1.2"/>
      <path d="M15.1 9.4 18.5 7.5"/>
      <path d="M19.5 7l1.8-1.4"/><path d="M19.5 7l.7 2.1"/>
    </g>

    <!-- gripper -->
    <g transform="translate(256 352) rotate(-14)">
      <path d="M6 3v7a6 6 0 0 0 12 0V3"/>
      <path d="M6 3h4"/><path d="M14 3h4"/>
      <path d="M12 16v5"/>
    </g>

    <!-- music note, small -->
    <g transform="translate(398 386) rotate(9) scale(0.8)">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </g>

    <!-- waves, small (blue) -->
    <g transform="translate(172 428) rotate(-5) scale(0.85)" stroke="#3a5a78" opacity="0.55">
      <path d="M2 9c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/>
      <path d="M2 15c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/>
    </g>

  </g>
</svg>
