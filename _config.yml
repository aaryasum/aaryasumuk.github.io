# Site
title: "Aarya Sumuk"
description: "Aarya Sumuk — Robot Learning Researcher. Stanford M.S. in Robotics: manipulation, tactile sensing, and human-robot interaction."
url: https://aaryasum.github.io
repository: "aaryasum/aaryasum.github.io"

# Author (used by the editorial layout sidebar)
author:
  email: "asumuk@stanford.edu"
  googlescholar: "https://scholar.google.com/citations?user=pQeK_c0AAAAJ&hl=en"
  github: "aaryasum"
  linkedin: "aarya-sumuk"

# Content collections (data only — pages render them via Liquid, no per-item pages)
collections:
  teaching:
    output: false
  publications:
    output: false
  projects:
    output: false

# Reading
include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - LICENSE
  - README.md
  - vendor
  - images/PXL_*

# Conversion
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
